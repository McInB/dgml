[project]
name = "dgml-storage-s3"
version = "0.1.0"
description = "Sample DGML StorageService backed by S3-compatible object storage and MongoDB."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Docugami" }]
readme = "README.md"
# boto3 (Apache-2.0) and pymongo (Apache-2.0) are both allow-list clean; see the
# licence note in README.md for the *server* side (MinIO, MongoDB Community).
dependencies = ["dgml-core>=0.1.0", "boto3>=1.34", "pymongo>=4.6"]

[tool.uv.sources]
dgml-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgml_storage_s3"]
