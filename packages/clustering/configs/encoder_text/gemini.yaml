# @package encoder_text
# Google Gemini text embeddings, called through litellm (no local model). Bring
# your own key: set the GEMINI_API_KEY env var (or extra.api_key). Select with:
#   encoder_text=gemini
name: gemini
# Any litellm-routable Gemini embedding model.
model_id: gemini/gemini-embedding-001
# Must match the model's output width (3072 for gemini-embedding-001). A
# mismatch is rejected at encode time. With the default parameter-free
# projector (training.identity_projector) this also has to equal manifold.dim,
# so raise that to 3072 too — otherwise the run fails at projector construction.
embedding_dim: 3072
multi_vector: false
# Token budget per document; the encoder truncates to roughly 4x this many
# characters. gemini-embedding-001 documents a 2048-token limit but does not
# enforce it — it accepts longer input and decides for itself what to do with
# the tail. Cutting here instead keeps the run reproducible and the bill
# bounded, and keeps the kept text at the front of the document, where the type
# is usually declared. Unset it to send the text through untouched.
max_length: 2000
extra:
  # Name of the env var holding the key (preferred over a literal api_key).
  # Leave both unset to let litellm resolve credentials itself (GOOGLE_API_KEY,
  # Vertex ADC, ...).
  api_key_env: GEMINI_API_KEY
  # Documents per request — the value the encoder benchmark ran at. Batching is
  # about round-trips, not price: billing is per token either way.
  batch_size: 100
  timeout: 60
  # Attempts after the first, on 429 / 5xx / timeout only, with exponential
  # backoff — so one rate-limit response doesn't throw away the embeddings
  # already paid for in this run. Handled by the encoder itself; litellm's own
  # num_retries kwarg does not apply to embedding calls.
  num_retries: 3
